<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="obsidian" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#181D28"/>
      <stop offset="100%" stop-color="#0B0E14"/>
    </linearGradient>
    <radialGradient id="amberGlow" cx="50%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.34"/>
      <stop offset="65%" stop-color="#F59E0B" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0B0E14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="pageLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="pageRight" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
  </defs>

  <!-- Outer Dark Obsidian Squircle -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#obsidian)" stroke="#FBBF24" stroke-opacity="0.32" stroke-width="6"/>
  <rect x="14" y="14" width="484" height="484" rx="106" fill="url(#amberGlow)" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="2"/>

  <!-- Sun Rays (Quiet Precision ticks) -->
  <g stroke="#FBBF24" stroke-width="14" stroke-linecap="round" opacity="0.9">
    <line x1="256" y1="92" x2="256" y2="120"/>
    <line x1="162" y1="128" x2="182" y2="148"/>
    <line x1="350" y1="128" x2="330" y2="148"/>
    <line x1="116" y1="208" x2="142" y2="216"/>
    <line x1="396" y1="208" x2="370" y2="216"/>
  </g>

  <!-- Rising Sun Disc -->
  <circle cx="256" cy="226" r="72" fill="url(#sun)"/>

  <!-- Open Ledger / Daybook Base Shadow -->
  <path d="M88 332 C 148 296, 214 298, 256 324 C 298 298, 364 296, 424 332 L 424 412 C 364 378, 298 378, 256 404 C 214 378, 148 378, 88 412 Z" fill="#06080C" opacity="0.65"/>

  <!-- Left & Right Ledger Pages -->
  <path d="M92 320 C 150 286, 214 288, 252 314 L 252 396 C 214 370, 150 368, 92 400 Z" fill="url(#pageLeft)"/>
  <path d="M420 320 C 362 286, 298 288, 260 314 L 260 396 C 298 370, 362 368, 420 400 Z" fill="url(#pageRight)"/>

  <!-- Telemetry Lines on Pages (Emerald + Sky Cyan + Amber) -->
  <g stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M126 336 C 156 322, 192 320, 222 328" stroke="#10B981"/>
    <path d="M126 362 C 156 348, 192 346, 214 352" stroke="#475569" opacity="0.65"/>
    <path d="M290 328 C 320 320, 356 322, 386 336" stroke="#38BDF8"/>
    <path d="M298 352 C 324 346, 356 348, 386 362" stroke="#F59E0B"/>
  </g>
</svg>
